[project]
name = "cogitate"
version = "0.1.2"
description = "A cognitive architecture exploration platform — multi-agent orchestration, LLM provider management, and workflow composition."
authors = [{ name = "The Cogitate Authors" }]
requires-python = ">=3.14"
license = "GPL-2.0-only"
dependencies = [
    "backend",
    "ddgs>=9.12.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "mistune>=3.2.0",
    "pydantic>=2.13",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.33.1",
]

[tool.uv.workspace]
members = [
    "backend",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
]

[tool.pytest.ini_options]
norecursedirs = [
    "scripts/testing",
    "scripts",
]
asyncio_mode = "auto"

[tool.uv.sources]
backend = { workspace = true, editable = true }
